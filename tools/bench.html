<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>weiqi-photo bench</title>
<style>
  body { font-family: system-ui, monospace; margin: 20px; background: #f6f7f9; }
  h1 { font-size: 20px; }
  #status { padding: 10px; background: #fff; border-radius: 6px; margin-bottom: 12px; }
  table { border-collapse: collapse; background: #fff; font-size: 12px; }
  th, td { border: 1px solid #ddd; padding: 4px 8px; text-align: left; }
  th { background: #eee; }
  .hit { color: #137333; font-weight: 600; }
  .miss { color: #c5221f; font-weight: 600; }
  .warn { color: #b06000; font-weight: 600; }
  #sum { font-size: 15px; margin: 12px 0; padding: 10px; background: #fff; border-radius: 6px; }
</style>
</head>
<body>
<h1>weiqi-photo bench — 测试集跑分</h1>
<div id="status">加载 opencv.js（约 10MB，首次较慢，可能 1-3 分钟）…</div>
<div id="sum"></div>
<div id="tbl"></div>

<script type="module">
import { loadCv } from "/dist/cv/adapter.js";
import { recognizeBoard } from "/dist/index.js";

const $ = (id) => document.getElementById(id);
const statusEl = $("status");

/** 解析期望矩阵：每行 19 个空格分隔的 token，'.' 或 '0' 为空，'b'/'1' 黑，'w'/'2' 白 */
function parseExpect(text) {
  const rows = text.trim().split("\n").map((r) => r.trim().split(/\s+/));
  const N = rows.length;
  const s = new Uint8Array(N * N);
  for (let j = 0; j < N; j++) {
    for (let i = 0; i < N; i++) {
      const t = (rows[j][i] || ".").toLowerCase();
      s[j * N + i] = t === "b" || t === "1" || t === "x" ? 1 : t === "w" || t === "2" || t === "o" ? 2 : 0;
    }
  }
  return { N, stones: s };
}

async function loadImage(url) {
  const im = new Image();
  await new Promise((res, rej) => { im.onload = res; im.onerror = rej; im.src = url; });
  return im;
}

// 预热：页面打开就后台加载
const cvReady = loadCv();

async function run() {
  statusEl.textContent = "后台加载 opencv.js（10MB，首次较慢）…";
  const cv = await cvReady;
  statusEl.textContent = "opencv 就绪，拉取测试集清单…";

  const list = await (await fetch("/bench/list")).json();
  statusEl.textContent = `opencv 就绪 · 测试集 ${list.items.length} 张 · 开始跑…`;

  const results = [];
  let pass = 0, accSum = 0;

  for (const it of list.items) {
    const t0 = performance.now();
    let rec = { name: it.name, acc: 0, N: 0, win: 0, ms: 0, err: "" };
    try {
      const im = await loadImage(it.img);
      const W = im.naturalWidth, H = im.naturalHeight;
      const c = document.createElement("canvas");
      // 与 demo 一致：最长边 2000
      const s = Math.min(1, 2000 / Math.max(W, H));
      c.width = Math.round(W * s); c.height = Math.round(H * s);
      const cx = c.getContext("2d");
      cx.imageSmoothingQuality = "high";
      cx.drawImage(im, 0, 0, c.width, c.height);

      const expTxt = await (await fetch(it.txt)).text();
      const exp = parseExpect(expTxt);

      const img = cv.imread(c);
      const r = recognizeBoard(cv, img, { size: 0 });
      img.delete();

      // 对比：只在路数吻合时逐格比；否则按 0 分计
      let hit = 0;
      if (r.N === exp.N) {
        for (let k = 0; k < exp.N * exp.N; k++) if (r.stones[k] === exp.stones[k]) hit++;
      } else {
        rec.err = `路数不符(得${r.N} 期${exp.N})`;
      }
      const acc = r.N === exp.N ? hit / (exp.N * exp.N) : 0;
      rec = { name: it.name, acc, N: r.N, win: r.debug && r.debug.win || 0, ms: Math.round(performance.now() - t0), err: rec.err };
      if (acc === 1) pass++;
      accSum += acc;
    } catch (e) {
      rec.err = String(e && e.message || e).slice(0, 60);
      rec.ms = Math.round(performance.now() - t0);
    }
    results.push(rec);

    const done = results.length;
    statusEl.textContent = `进度 ${done}/${list.items.length} · 全对 ${pass} · 平均 ${((accSum / done) * 100).toFixed(2)}%`;
    render(results, pass, accSum, done);
    await new Promise((r) => setTimeout(r, 0));   // 让出主线程，UI 能刷新
  }

  statusEl.textContent = "完成。";
  console.log(JSON.stringify({ pass, total: results.length, avgAcc: accSum / results.length, items: results }, null, 2));
}

function render(results, pass, accSum, done) {
  const rows = results.map((it) => {
    const cls = it.acc === 1 ? "hit" : it.acc >= 0.95 ? "warn" : "miss";
    return `<tr><td>${it.name}</td><td class="${cls}">${(it.acc * 100).toFixed(1)}%</td>` +
           `<td>${it.N}</td><td>${it.win ? it.win.toFixed(2) : "-"}</td>` +
           `<td>${it.ms}ms</td><td>${it.err || ""}</td></tr>`;
  }).join("");
  $("sum").innerHTML = `全对 <b>${pass}/${done}</b> · 平均准确率 <b>${((accSum / done) * 100).toFixed(2)}%</b>`;
  $("tbl").innerHTML =
    `<table><tr><th>文件</th><th>准确率</th><th>路数</th><th>得分</th><th>耗时</th><th>错误</th></tr>${rows}</table>`;
}

run().catch((e) => {
  statusEl.textContent = "失败：" + (e && e.message);
  console.error(e);
});
</script>
</body>
</html>
